<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Finnik Game</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div id="app">
      <div id="topbar">
        <div id="score">0</div>
        <div id="status"></div>
      </div>

      <canvas id="game" width="360" height="640"></canvas>

      <!-- Background music (place file into /webapp/assets/audio/) -->
      <audio id="bgm" preload="auto" loop playsinline>
        <source src="/assets/audio/bgm.mp3" type="audio/mpeg" />
        <source src="/assets/audio/bgm.ogg" type="audio/ogg" />
      </audio>

      <div id="overlay" class="hidden">
        <div id="overlayCard">
          <div id="overlayTitle"></div>
          <div id="overlayBody"></div>
          <div id="overlayButtons"></div>
        </div>
      </div>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
